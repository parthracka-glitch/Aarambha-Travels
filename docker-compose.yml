version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aarambha_postgres
    environment:
      POSTGRES_USER: aarambha_user
      POSTGRES_PASSWORD: aarambha_password
      POSTGRES_DB: aarambha_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aarambha_user -d aarambha_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
