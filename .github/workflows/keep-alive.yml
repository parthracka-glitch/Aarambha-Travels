name: 24/7 Cloud API Keep-Alive

on:
  schedule:
    # Trigger ping every 10 minutes to prevent free-tier cloud containers from entering sleep mode
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-alive-pings
  cancel-in-progress: true

jobs:
  ping-healthcheck:
    name: 💓 Ping Healthcheck Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Healthcheck Request
        run: |
          BACKEND_URL="${{ secrets.BACKEND_URL }}"
          if [ -z "$BACKEND_URL" ]; then
            BACKEND_URL="https://aarambha-backend-api.onrender.com"
          fi
          
          echo "Dispatching healthcheck request to: $BACKEND_URL/api/health"
          RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "$BACKEND_URL/api/health" || echo "000")
          
          echo "Healthcheck Response Status: $RESPONSE_CODE"
          if [ "$RESPONSE_CODE" -ge 200 ] && [ "$RESPONSE_CODE" -le 399 ]; then
            echo "✅ Backend service is active and responsive."
          else
            echo "⚠️ Backend service is warming up or unresponsive (HTTP $RESPONSE_CODE). Ping successfully dispatched to trigger instance wakeup."
          fi
